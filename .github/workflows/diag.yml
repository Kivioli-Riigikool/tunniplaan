name: Diagnostika (ajutine)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in kivioli1keskkool.edupage.org kiviol1keskkool.edupage.org edupage.org; do
            echo "== $h"; dig +short $h A; echo "-- AAAA"; dig +short $h AAAA
          done
      - name: Curl IPv4
        run: curl -4 -sS -m 20 -o /dev/null -w 'ipv4 http=%{http_code} aeg=%{time_total}\n' https://kivioli1keskkool.edupage.org/ || echo "ipv4 labi kukkus"
      - name: Curl IPv6
        run: curl -6 -sS -m 20 -o /dev/null -w 'ipv6 http=%{http_code} aeg=%{time_total}\n' https://kivioli1keskkool.edupage.org/ || echo "ipv6 labi kukkus"
      - name: Curl POST
        run: |
          curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
            -d '{"__args":[null,2026],"__gsh":"00000000"}' \
            -o /tmp/vastus.json -w 'post http=%{http_code}\n' \
            'https://kivioli1keskkool.edupage.org/timetable/server/ttviewer.js?__func=getTTViewerData' || echo "post labi kukkus"
          head -c 300 /tmp/vastus.json || true
      - name: Node fetch
        run: |
          node -e "
          fetch('https://kivioli1keskkool.edupage.org/', { signal: AbortSignal.timeout(20000) })
            .then(r => console.log('node fetch ok', r.status))
            .catch(e => console.log('node fetch viga', e.cause?.code || e.message));
          "
      - name: Valjuv port 443
        run: |
          echo "runneri avalik IP:"; curl -sS -m 10 https://api.ipify.org || true; echo
