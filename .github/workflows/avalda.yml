name: Avalda tunniplaan

# Genereerimine kaib kohalikus masinas, mitte siin.
#
# EduPage ei vota GitHubi runneri (Azure) IP-ga uhendust vastu: DNS
# lahendub, muu internet toimib, aga port 443 EduPage'i pihta laheb
# timeouti nii IPv4 kui IPv6 peal. Blokk on TCP tasemel, seega paise
# ega paringu kujuga seda mooda ei saa.
#
# Seetottu on dist/ gitis ja see workflow ainult avaldab selle.
# Uuendamine: ./avalda.sh

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/avalda.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  avalda:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
